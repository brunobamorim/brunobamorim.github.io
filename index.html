<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bruno Amorim — o portfólio mudou de endereço</title>

<!-- O portfólio vive em brunoamorim-portfolio.lovable.app. Este endereço só redireciona.
     O GitHub Pages serve arquivos estáticos e não emite 301, então o redirecionamento é
     feito em três camadas, da mais rápida para a mais tolerante:
       1. o <script>, que troca a entrada no histórico (location.replace) e dispara antes
          de o <body> pintar;
       2. o <meta http-equiv="refresh">, para quem está com JavaScript desligado;
       3. o link visível abaixo, que é o que sobra se as duas falharem.
     O <link rel="canonical"> é para o buscador, que não segue meta refresh como um 301:
     ele diz qual é o endereço de verdade. -->
<link rel="canonical" href="https://brunoamorim-portfolio.lovable.app/">
<meta http-equiv="refresh" content="0; url=https://brunoamorim-portfolio.lovable.app/">
<meta name="robots" content="noindex, follow">
<script>location.replace("https://brunoamorim-portfolio.lovable.app/");</script>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    background: #ffffff;
    color: #1b1b1f;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.75rem; }
  p { margin: 0 0 1.5rem; color: #55555f; }
  a.ir {
    display: inline-block;
    padding: 0.7rem 1.4rem;
    border-radius: 0.5rem;
    background: #1b1b1f;
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
  }
  a.ir:hover, a.ir:focus { background: #3a3a42; }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #ededf0; }
    p { color: #a6a6b0; }
    a.ir { background: #ededf0; color: #16161a; }
    a.ir:hover, a.ir:focus { background: #c9c9d2; }
  }
</style>
</head>
<body>
<main>
  <h1>O portfólio mudou de endereço</h1>
  <p>Você está sendo levado para <strong>brunoamorim-portfolio.lovable.app</strong>. Se nada acontecer, use o botão abaixo.</p>
  <p><a class="ir" href="https://brunoamorim-portfolio.lovable.app/">Ir para o portfólio</a></p>
</main>
</body>
</html>
